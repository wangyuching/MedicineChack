<!-- 顯示蓋子為開且沒有要的圖片的紀錄 -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Check Medicine</title>
    <style>
        body {
            background-color: rgb(240, 244, 247);
            margin: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
        }

        .pageChange {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .pageChange a {
            color: rgb(8, 24, 94);
            text-decoration: none;
            padding: 15px 10px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            background-color: rgb(229, 235, 240);
            margin-bottom: 2px;
        }

        .pageChange a:hover {
            background-color: rgb(118, 193, 255);
        }

        .content {
            margin-left: 60px;
            width: calc(100vw - 80px);
            height: 95vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .log-container {
            width: 100%;
            height: 85%;
            background-color: rgb(233, 245, 254);
            color: rgb(8, 24, 94);
            padding: 20px;
            overflow-y: auto;
            border-radius: 8px;
        }

        .data-group {
            margin-bottom: 25px;
        }

        .data-title {
            font-size: 20px;
            font-weight: bold;
            border-bottom: 2px solid rgb(118, 193, 255);
            padding-bottom: 5px;
            margin-bottom: 15px;
            text-align: left;
        }

        .record-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .record-card {
            background: white;
            border-radius: 6px;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
        }

        .record-time {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            text-align: center;
        }

        .img-container {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #f8f9fa;
            border-radius: 4px;
        }

        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .no-img {
            color: rgb(255, 0, 0);
            font-weight: bold;
        }

        .pagination-container {
            margin-top: 10px;
        }

        .page-num-btn {
            min-width: 38px;
        }
    </style>
</head>

<body>
    <div class="pageChange">
        <a href="{{ url_for('home') }}">記錄中</a>
        <a href="#" style="background-color: rgb(118, 193, 255);">搜尋記錄</a>
    </div>

    <div class="content">
        <div class="log-container">
            <div class="log" id="log-content">載入中...請稍候...</div>
        </div>

        <div class="pagination-container">
            <button class="btn btn-secondary me-2" id="btn-prev" onclick="changePagination(-1)">上一頁</button>
            <span class="fw-bold text-dark me-2" id="page-info">第 1 頁</span>
            <button class="btn btn-secondary" id="btn-next" onclick="changePagination(1)">下一頁</button>
        </div>
    </div>
</body>

</html>

<script>
    let allData = [];
    let currentPage = 1;
    const itemsPerPage = 9;

    function refreshTable() {
        fetch('/api/history')
            .then(response => response.json())
            .then(data => {
                allData = [...data].reverse();
                renderPage();
            })
            .catch(error => console.error('Error fetching data:', error));
    }

    function renderPage() {
        const logContent = document.getElementById("log-content");

        if (allData.length === 0) {
            logContent.innerHTML = '<div class="text-center fs-5">目前沒有記錄。</div>';
            if (pageInfo) pageInfo.innerHTML = '<span class="fw-bold text-dark mx-2">第 0 頁</span>';
            document.getElementById("btn-prev").disabled = true;
            document.getElementById("btn-next").disabled = true;
            return;
        }

        const totalPages = Math.ceil(allData.length / itemsPerPage);
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageData = allData.slice(startIndex, endIndex);

        const groupedData = {};
        pageData.forEach((row, index) => {
            const globalIndex = startIndex + index;
            const isLatest = globalIndex === 0;

            const dataStr = row.dt.split(" ")[0] || "未知日期";
            const timeStr = row.dt.split(" ")[1] || "未知時間";

            if (!groupedData[dataStr]) {
                groupedData[dataStr] = [];
            }
            groupedData[dataStr].push({ ...row, timeStr, isLatest });
        });

        let htmlContent = "";

        for (const data in groupedData) {
            htmlContent += `
                <div class="data-group">
                    <div class="data-title">${data}</div>
                    <div class="record-grid">
            `;

            groupedData[data].forEach(row => {
                const badge = row.isLatest ? '<span class="badge bg-success ms-1">最新紀錄</span>' : '';

                htmlContent += `
                    <div class="record-card">
                        <div class="record-time">${row.timeStr}${badge}</div>
                        <div class="img-container">
                `;

                if (row.img) {
                    htmlContent += `<img src="data:image/jpeg;base64,${row.img}" alt="Record Image">`;
                } else {
                    htmlContent += `<div class="no-image">沒有圖片</div>`;
                }

                htmlContent += `
                        </div>
                    </div>
                `;
            });
            htmlContent += `
                    </div>
                </div>
            `;
        }

        logContent.innerHTML = htmlContent;

        renderPaginationButtons(totalPages);
    }

    function renderPaginationButtons(totalPages) {
        const pageInfo = document.getElementById("page-info");
        let paginationHtml = "";

        if (totalPages <= 5) {
            for (let i = 1; i <= totalPages; i++) {
                paginationHtml += createPageButton(i, i === currentPage);
            }
        } else {
            paginationHtml += createPageButton(1, 1 === currentPage);

            if (currentPage > 3) {
                paginationHtml += `<span class="text-muted px-1">...</span>`;
            }

            let startPage = Math.max(2, currentPage - 1);
            let endPage = Math.min(totalPages - 1, currentPage + 1);

            if (currentPage <= 3) {
                endPage = 4;
            } else if (currentPage >= totalPages - 2) {
                startPage = totalPages - 3;
            }

            for (let i = startPage; i <= endPage; i++) {
                paginationHtml += createPageButton(i, i === currentPage);
            }

            if (currentPage < totalPages - 2) {
                paginationHtml += `<span class="text-muted px-1">...</span>`;
            }

            paginationHtml += createPageButton(totalPages, totalPages === currentPage);
        }

        pageInfo.innerHTML = paginationHtml;

        document.getElementById("btn-prev").disabled = currentPage === 1;
        document.getElementById("btn-next").disabled = currentPage === totalPages || totalPages === 0;
    }

    function createPageButton(pageNum, isActive) {
        const btnClass = isActive ? 'btn btn-primary page-num-btn' : 'btn btn-outline-primary page-num-btn';
        return `<button class="${btnClass}" onclick="goToPage(${pageNum})">${pageNum}</button>`;
    }

    function goToPage(pageNum) {
        currentPage = pageNum;
        renderPage();
    }

    function changePagination(offset) {
        currentPage += offset;
        renderPage();
    }

    setInterval(refreshTable, 5000);

    window.onload = refreshTable;
</script>
