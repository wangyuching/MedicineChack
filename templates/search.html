#只顯示蓋子為開且沒有要的圖片的紀錄
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Check Medicine</title>
    <style>
        body {
            background-color: rgb(20, 29, 37);
            margin: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
        }              
        
        .pageChange {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .pageChange a {
            color: rgb(213, 219, 255);
            text-decoration: none;
            padding: 15px 10px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            background-color: rgba(255, 255, 255, 0.05);
            margin-bottom: 2px;
        }

        .pageChange a:hover {
            background-color: rgb(50, 58, 66);
        }

        .content {
            margin: 0;
            width: 90vw;
            height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
        } 

        .time {
            width: 80%;
            height: 80%;
            background-color: rgb(8, 18, 26);
            color: rgb(22, 239, 18);
            font-size: 18px;
            text-align: center;
            padding: 15px 0px 15px 0px;
            overflow-y: hidden;
            white-space: pre-line;
            flex-grow: 1;
        }
    </style>
</head>

<body>
    <div class="pageChange">
        <a href="{{ url_for('home') }}">記錄中</a>
        <a href="#" style="background-color: #3498db;">搜尋記錄</a>
    </div>

    <div class="content">
        <div class="time-container" style="width: 30%; display: flex; flex-direction: column; height: 90%;">
            <div class="time" id="log-content">載入中...請稍候...</div>
        </div>
    </div>
</body>

</html>

<script>
    function refreshTable() {
        fetch('/api/history')
            .then(response => response.json())
            .then(data => {
                const logContent = document.getElementById("log-content");

                if (data.length === 0) {
                    logContent.innerHTML = '目前沒有記錄。';
                    return;
                }

                let htmlContent = "";
                [...data].reverse().forEach((row, index) => {

                    const isLatest = index === 0 ? '<span class="badge bg-success">最新紀錄</span>' : '';

                    htmlContent += `
                        <p style="line-height: 1;">${row.dt} ${isLatest}</p>
                    `;
                    
                    if (row.img) {
                        htmlContent += `
                            <img src="data:image/jpeg;base64,${row.img}" alt="Image" style="max-width: 100%; max-height: 200px; margin-bottom: 10px;">
                        `;
                    }
                    else {
                        htmlContent += `
                            <p style="line-height: 1; color: rgb(255, 0, 0);">沒有圖片</p>
                        `;
                    }
                });

                logContent.innerHTML = htmlContent;
            })
            .catch(error => console.error('Error fetching data:', error));
    }

    setInterval(refreshTable, 5000);

    window.onload = refreshTable;
</script>
