<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <title>Check Medicine</title>
    <style>
        body {
            background-color: rgb(240, 244, 247);
            margin: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
        }

        .pageChange {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            width: 44px;
        }

        .pageChange a,
        .calendar-toggle-btn {
            color: rgb(8, 24, 94);
            text-decoration: none;
            padding: 15px 0px;
            width: 100%;
            box-sizing: border-box;
            writing-mode: vertical-rl;
            text-orientation: upright;
            background-color: rgb(229, 235, 240);
            margin-bottom: 2px;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .pageChange a:hover,
        .calendar-toggle-btn:hover {
            background-color: rgb(118, 193, 255);
        }

        .calendar-toggle-btn i {
            writing-mode: horizontal-tb;
            font-size: 16px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .floating-calendar {
            display: none;
            position: absolute;
            top: 220px;
            left: 49px;
            width: 300px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            z-index: 1050;
            padding: 15px;
            color: rgb(8, 24, 94);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
            font-size: 13px;
        }

        .calendar-day-label {
            font-weight: bold;
            color: rgb(102, 112, 121);
            padding-bottom: 5px;
        }

        .calendar-day {
            padding: 6px 0;
            border-radius: 4px;
            cursor: default;
            color: rgb(205, 206, 206);
            position: relative;
        }

        .calendar-day.has-record {
            color: rgb(8, 24, 94);
            font-weight: bold;
            background-color: rgb(233, 245, 254);
            cursor: pointer;
            border: 1px solid rgb(118, 193, 255);
        }

        .calendar-day.has-record:hover {
            background-color: rgb(118, 193, 255);
            color: white;
        }

        .calendar-day.current-selected {
            background-color: rgb(8, 24, 94) !important;
            color: white !important;
        }

        .content {
            margin-left: 60px;
            width: calc(100vw - 80px);
            height: 95vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .log-container {
            width: 100%;
            height: 88%;
            background-color: rgb(233, 245, 254);
            color: rgb(8, 24, 94);
            margin-bottom: 10px;
            padding: 20px;
            overflow-y: auto;
            border-radius: 8px;
        }

        .data-group {
            margin-bottom: 25px;
        }

        .data-title {
            font-size: 20px;
            font-weight: bold;
            border-bottom: 2px solid rgb(118, 193, 255);
            padding-bottom: 5px;
            margin-bottom: 15px;
            text-align: left;
        }

        .record-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .record-card {
            background: white;
            border-radius: 6px;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
        }

        .record-time {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            text-align: center;
        }

        .img-container {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #f8f9fa;
            border-radius: 4px;
        }

        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .no-image {
            color: rgb(255, 0, 0);
            font-weight: bold;
        }

        .pagination-container {
            margin-top: 10px;
        }

        .page-num-btn {
            min-width: 38px;
        }
    </style>
</head>

<body>
    <div class="pageChange">
        <a href="{{ url_for('home') }}">記錄中</a>
        <a href="#" style="background-color: rgb(118, 193, 255);">搜尋記錄</a>
        <button class="calendar-toggle-btn" onclick="toggleCalendar()">
            <i class="bi bi-calendar3"></i>開啟日曆
        </button>
    </div>
    <div class="floating-calendar" id="floating-calendar">
        <div class="calendar-header">
            <button class="btn btn-sm btn-outline-secondary" onclick="moveMonth(-1)"><i
                    class="bi bi-chevron-left"></i></button>
            <span id="calendar-month-year">2026 年 05 月</span>
            <button class="btn btn-sm btn-outline-secondary" onclick="moveMonth(1)"><i
                    class="bi bi-chevron-right"></i></button>
        </div>
        <div class="calendar-grid" id="calendar-grid">
        </div>
    </div>

    <div class="content">
        <div class="pagination-container">
            <button class="btn btn-secondary me-2" id="btn-prev" onclick="changePagination(-1)">上一頁</button>
            <span class="fw-bold text-dark me-2" id="page-info"></span>
            <button class="btn btn-secondary" id="btn-next" onclick="changePagination(1)">下一頁</button>
        </div>
        <div class="log-container">
            <div class="log" id="log-content">載入中...請稍候...</div>
        </div>
    </div>
</body>

</html>

<script>
    let allData = [];
    let groupedDataArray = [];
    let currentPage = 1;

    let currentCalYear = new Date().getFullYear();
    let currentCalMonth = new Date().getMonth();

    function refreshTable() {
        fetch('/api/history')
            .then(response => response.json())
            .then(data => {
                allData = [...data].reverse();
                groupAllDataByDate();
                renderPage();
                renderCalendar();
            })
            .catch(error => console.error('Error fetching data:', error));
    }

    function groupAllDataByDate() {
        const groups = [];

        allData.forEach((row, index) => {
            const isLatest = index === 0;
            const dataStr = row.dt.split(" ")[0] || "未知日期";
            const timeStr = row.dt.split(" ")[1] || "未知時間";

            let existingGroup = groups.find(group => group.data === dataStr);
            if (!existingGroup) {
                existingGroup = { data: dataStr, records: [] };
                groups.push(existingGroup);
            }
            existingGroup.records.push({ ...row, timeStr, isLatest });
        });

        groupedDataArray = groups;
    }

    function renderPage() {
        const logContent = document.getElementById("log-content");

        if (groupedDataArray.length === 0) {
            logContent.innerHTML = '<div class="text-center fs-5">目前沒有記錄。</div>';
            const pageInfo = document.getElementById("page-info");
            if (pageInfo) pageInfo.innerHTML = '<span class="fw-bold text-dark mx-2">第 0 頁</span>';
            document.getElementById("btn-prev").disabled = true;
            document.getElementById("btn-next").disabled = true;
            return;
        }

        const totalPages = groupedDataArray.length;
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const currentGroup = groupedDataArray[currentPage - 1];

        if (currentGroup && currentGroup.data !== "未知日期") {
            const dateParts = currentGroup.data.split("-");
            if (dateParts.length === 3) {
            }
        }

        let htmlContent = "";
        htmlContent += `
            <div class="data-group">
                <div class="data-title">
                    <span>${currentGroup.data}</span>
                    <span class="badge bg-secondary fs-6">共 ${currentGroup.records.length} 筆資料</span>
                </div>
                <div class="record-grid">
        `;

        currentGroup.records.forEach(row => {
            const badge = row.isLatest ? '<span class="badge bg-success ms-1">最新紀錄</span>' : '';

            htmlContent += `
                <div class="record-card">
                    <div class="record-time">${row.timeStr}${badge}</div>
                    <div class="img-container">
            `;

            if (row.img) {
                htmlContent += `<img src="data:image/jpeg;base64,${row.img}" alt="Record Image">`;
            } else {
                htmlContent += `<div class="no-image">沒有圖片</div>`;
            }

            htmlContent += `
                    </div>
                </div>
            `;
        });

        htmlContent += `
                </div>
            </div>
        `;

        logContent.innerHTML = htmlContent;

        renderPaginationButtons(totalPages);

        renderCalendar();
    }

    function renderPaginationButtons(totalPages) {
        const pageInfo = document.getElementById("page-info");
        let paginationHtml = "";

        if (totalPages <= 5) {
            for (let i = 1; i <= totalPages; i++) {
                paginationHtml += createPageButton(i, i === currentPage);
            }
        } else {
            paginationHtml += createPageButton(1, 1 === currentPage);

            if (currentPage > 3) {
                paginationHtml += `<span class="text-muted px-1">...</span>`;
            }

            let startPage = Math.max(2, currentPage - 1);
            let endPage = Math.min(totalPages - 1, currentPage + 1);

            if (currentPage <= 3) {
                endPage = 4;
            } else if (currentPage >= totalPages - 2) {
                startPage = totalPages - 3;
            }

            for (let i = startPage; i <= endPage; i++) {
                paginationHtml += createPageButton(i, i === currentPage);
            }

            if (currentPage < totalPages - 2) {
                paginationHtml += `<span class="text-muted px-1">...</span>`;
            }

            paginationHtml += createPageButton(totalPages, totalPages === currentPage);
        }

        pageInfo.innerHTML = paginationHtml;

        document.getElementById("btn-prev").disabled = currentPage === 1;
        document.getElementById("btn-next").disabled = currentPage === totalPages || totalPages === 0;
    }

    function createPageButton(pageNum, isActive) {
        const btnClass = isActive ? 'btn btn-primary page-num-btn' : 'btn btn-outline-primary page-num-btn';
        return `<button class="${btnClass}" onclick="goToPage(${pageNum})">${pageNum}</button>`;
    }

    function goToPage(pageNum) {
        currentPage = pageNum;
        renderPage();
    }

    function changePagination(offset) {
        currentPage += offset;
        renderPage();
    }

    function toggleCalendar() {
        const cal = document.getElementById("floating-calendar");
        if (cal.style.display === "block") {
            cal.style.display = "none";
        } else {
            if (groupedDataArray.length > 0 && groupedDataArray[currentPage - 1]) {
                const currentDateStr = groupedDataArray[currentPage - 1].data;
                const parts = currentDateStr.split("-");
                if (parts.length === 3) {
                    currentCalYear = parseInt(parts[0]);
                    currentCalMonth = parseInt(parts[1]) - 1;
                }
            }
            cal.style.display = "block";
            renderCalendar();
        }
    }

    function moveMonth(direction) {
        currentCalMonth += direction;
        if (currentCalMonth > 11) {
            currentCalMonth = 0;
            currentCalYear++;
        } else if (currentCalMonth < 0) {
            currentCalMonth = 11;
            currentCalYear--;
        }
        renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById("calendar-grid");
        const monthYearLabel = document.getElementById("calendar-month-year");

        if (!grid) return;

        monthYearLabel.textContent = `${currentCalYear} 年 ${String(currentCalMonth + 1).padStart(2, '0')} 月`;

        grid.innerHTML = "";

        const weekLabels = ["日", "一", "二", "三", "四", "五", "六"];
        weekLabels.forEach(label => {
            grid.innerHTML += `<div class="calendar-day-label">${label}</div>`;
        });

        const firstDayIndex = new Date(currentCalYear, currentCalMonth, 1).getDay();
        const totalDays = new Date(currentCalYear, currentCalMonth + 1, 0).getDate();

        for (let i = 0; i < firstDayIndex; i++) {
            grid.innerHTML += `<div class="calendar-day"></div>`;
        }

        const currentSelectedDateStr = groupedDataArray[currentPage - 1] ? groupedDataArray[currentPage - 1].data : "";

        for (let day = 1; day <= totalDays; day++) {
            const dateStr = `${currentCalYear}-${String(currentCalMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

            const groupIndex = groupedDataArray.findIndex(group => group.data === dateStr);
            const hasRecord = groupIndex !== -1;
            const isCurrentlySelected = dateStr === currentSelectedDateStr;

            let dayClass = "calendar-day";
            let onClickAttribute = "";

            if (hasRecord) {
                dayClass += " has-record";
                onClickAttribute = `onclick="goToPage(${groupIndex + 1})"`;
            }
            if (isCurrentlySelected) {
                dayClass += " current-selected";
            }

            grid.innerHTML += `<div class="${dayClass}" ${onClickAttribute}>${day}</div>`;
        }
    }

    document.addEventListener("click", function (event) {
        const cal = document.getElementById("floating-calendar");
        const toggleBtn = document.querySelector(".calendar-toggle-btn");
        if (cal && cal.style.display === "block" && !cal.contains(event.target) && !toggleBtn.contains(event.target)) {
            cal.style.display = "none";
        }
    });

    setInterval(refreshTable, 5000);

    window.onload = refreshTable;
</script>
