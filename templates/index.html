<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Take Medicine</title>
    <style>
        body {
            background-color: rgb(240, 244, 247);
            margin: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
        }

        .pageChange {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .pageChange a {
            color: rgb(8, 24, 94);
            text-decoration: none;
            padding: 15px 10px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            background-color: rgb(229, 235, 240);
            margin-bottom: 2px;
        }

        .pageChange a:hover {
            background-color: rgb(118, 193, 255);
        }

        .content {
            margin-left: 60px;
            width: calc(100vw - 80px);
            height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
        }

        .log-container {
            width: 20%;
            height: 85%;
            background-color: rgb(233, 245, 254);
            color: rgb(8, 24, 94);
            padding: 20px;
            overflow-y: auto;
            border-radius: 8px;
        }

        .video-container {
            width: 70%;
            height: 85%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            overflow: hidden;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <div class="pageChange">
        <a href="#"style="background-color: rgb(118, 193, 255);">記錄中</a>
        <a href="{{ url_for('search') }}">搜尋記錄</a>
    </div>

    <div class="content">
        <div class="log-container">
            <div class="log" id="log-content">載入中...請稍候...</div>
        </div>
        
        <div class="video-container">
            <img src="{{ url_for('cap_in_html') }}" alt="Video Stream">
        </div>
    </div>
</body>

</html>

<script>
    function refreshTable() {
        fetch('/api/history')
            .then(response => response.json())
            .then(data => {
                const logContent = document.getElementById("log-content");

                if (data.length === 0) {
                    logContent.innerHTML = '目前沒有記錄。';
                    return;
                }

                let htmlContent = "";
                [...data].reverse().forEach((row, index) => {
                    const isLatest = index === 0 ? '<span class="badge bg-success ms-1">最新紀錄</span>' : '';
                    htmlContent += `
                        <p style="line-height: 1.5; border-bottom: 1px dashed rgba(8, 24, 94, 0.2); padding-bottom: 8px;">
                            ${row.dt} ${isLatest}
                        </p>
                    `;
                });

                logContent.innerHTML = htmlContent;
            })
            .catch(error => console.error('Error fetching data:', error));
    }

    setInterval(refreshTable, 5000);

    window.onload = refreshTable;
</script>
