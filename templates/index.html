<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Take Medicine</title>

</head>

<body>
    <div class="pageChange">
        <a href="#" style="background-color: rgb(118, 193, 255);">記錄中</a>
        <a href="{{ url_for('search') }}">搜尋記錄</a>
    </div>

    <div class="content">
        <div class="log-container">
            <div class="log" id="log-content">載入中...請稍候...</div>
        </div>

        <div class="video-container">
            <img src="{{ url_for('cap_in_html') }}" alt="Video Stream">
        </div>
    </div>
</body>

</html>

<script>
    function refreshTable() {
        fetch('/api/history')
            .then(response => response.json())
            .then(data => {
                const logContent = document.getElementById("log-content");

                if (data.length === 0) {
                    logContent.innerHTML = '目前沒有記錄。';
                    return;
                }

                let htmlContent = "";
                [...data].reverse().forEach((row, index) => {
                    const isLatest = index === 0 ? '<span class="badge bg-success ms-1">最新紀錄</span>' : '';
                    htmlContent += `
                        <p style="line-height: 1.5; border-bottom: 1px dashed rgba(8, 24, 94, 0.2); padding-bottom: 8px;">
                            ${row.dt} ${isLatest}
                        </p>
                    `;
                });

                logContent.innerHTML = htmlContent;
            })
            .catch(error => console.error('Error fetching data:', error));
    }

    setInterval(refreshTable, 5000);

    window.onload = refreshTable;
</script>
